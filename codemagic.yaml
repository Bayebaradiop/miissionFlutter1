workflows:
  ios-workflow:
    name: iOS TestFlight Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      # Flutter version
      flutter: stable
      xcode: latest
      cocoapods: default
      
      # Variables d'environnement (à configurer dans Codemagic UI)
      vars:
        # Apple App Store Connect
        # APP_STORE_CONNECT_ISSUER_ID: Configured in Codemagic UI
        # APP_STORE_CONNECT_KEY_IDENTIFIER: Configured in Codemagic UI
        # APP_STORE_CONNECT_PRIVATE_KEY: Configured in Codemagic UI
        # CERTIFICATE_PRIVATE_KEY: Configured in Codemagic UI
        
        # App configuration
        BUNDLE_ID: "com.bayebaradiop.app1" # Changez selon votre Bundle ID
        APP_STORE_ID: 1234567890 # ID de l'app sur App Store Connect (à créer)
        
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      
      - name: Flutter analyze
        script: |
          flutter analyze
      
      - name: Flutter test
        script: |
          flutter test
        ignore_failure: true
      
      - name: Build iOS app
        script: |
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    
    publishing:
      # Email notifications
      email:
        recipients:
          - bayebara2000@gmail.com
        notify:
          success: true
          failure: true
      
      # App Store Connect publishing
      app_store_connect:
        # API key from App Store Connect (https://appstoreconnect.apple.com/access/api)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        
        # Configuration pour TestFlight
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
